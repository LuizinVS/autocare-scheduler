<div class="min-h-screen">
  <header class="sticky top-0 z-20 border-b border-slate-200/80 bg-white/90 backdrop-blur">
    <div class="mx-auto max-w-7xl px-4 py-4 sm:px-6 lg:px-8">
      <div class="flex flex-wrap items-center justify-between gap-4">
        <a routerLink="/dashboard">
          <p class="text-xs font-semibold uppercase tracking-[0.32em] text-sky-700">Oficina</p>
          <h1 class="mt-1 text-2xl font-black text-slate-900">{{ title() }}</h1>
        </a>
        <nav aria-label="Navegação principal" class="flex flex-wrap gap-2 text-sm font-medium text-slate-600">
          @for (item of navigation; track item.path) {
            <a
              [routerLink]="item.path"
              routerLinkActive="bg-sky-600 text-white shadow-lg shadow-sky-200"
              [routerLinkActiveOptions]="{ exact: false }"
              class="rounded-full border border-slate-200 px-4 py-2 transition hover:border-sky-300 hover:text-sky-700"
            >{{ item.label }}</a>
          }
        </nav>
      </div>

      @if (feedback.message(); as message) {
        <div
          role="status"
          class="mt-4 flex items-center justify-between gap-4 rounded-2xl border px-4 py-3 text-sm shadow-sm"
          [class]="message.kind === 'error'
            ? 'border-rose-200 bg-rose-50 text-rose-900'
            : message.kind === 'success'
              ? 'border-emerald-200 bg-emerald-50 text-emerald-900'
              : 'border-sky-200 bg-sky-50 text-sky-900'"
        >
          <span>{{ message.text }}</span>
          <button class="font-semibold" type="button" (click)="feedback.clear()">Fechar</button>
        </div>
      }
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
    <router-outlet />
  </main>
</div>
