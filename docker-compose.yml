services:
  mysql:
    image: mysql:8.0
    container_name: autocare-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: autocare_scheduler
      MYSQL_USER: luiz
      MYSQL_PASSWORD: admin
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: autocare-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: luiz
      DB_PASSWORD: admin
      CORS_ORIGINS: http://localhost:4200
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@autocare.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-before-deploying}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: autocare-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:4200"

volumes:
  mysql_data:
